services:
  watcher:
    build: .
    image: x-reset-watcher:local
    command: ["-watch", "-interval", "${WATCH_INTERVAL:-5m}"]
    restart: "no"
    init: true
    user: "${WATCH_UID:?Set WATCH_UID to private config owner}:${WATCH_GID:?Set WATCH_GID to private config group}"
    environment:
      WATCH_CONFIG_PATH: /run/watcher/config.json
      WATCH_STATE_PATH: /data/state.json
    volumes:
      - ${WATCH_CONFIG_FILE:?Set absolute path to private config}:/run/watcher/config.json:ro
      - ${WATCH_DATA_DIR:?Set absolute path to state directory}:/data
  classifier:
    build: .
    image: x-reset-watcher:local
    user: "${WATCH_UID:?Set WATCH_UID to private config owner}:${WATCH_GID:?Set WATCH_GID to private config group}"
    environment:
      WATCH_CONFIG_PATH: /run/watcher/config.json
    volumes:
      - ${WATCH_CONFIG_FILE:?Set absolute path to private config}:/run/watcher/config.json:ro
    profiles: [manual]
